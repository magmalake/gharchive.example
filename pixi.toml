[workspace]
preview = ["pixi-build"]
authors = ["Marius S <39998+winding-lines@users.noreply.github.com>"]
channels = ["https://conda.modular.com/max", "conda-forge"]
name = "mojo-census"
platforms = ["osx-arm64", "linux-aarch64"]
version = "0.1.0"

[tasks]
# Build the way orca's image does: every program with -I src.
build-orca = "mkdir -p build && mojo build bin/scheduler.mojo -o build/orca"
build-console = "mkdir -p build && mojo build -I src bin/console.mojo -o build/console"
build-gharchive = "mkdir -p build && mojo build -I src pipelines/gharchive.mojo -o build/gharchive"
build-mojo-repos = "mkdir -p build && mojo build -I src pipelines/mojo_repos.mojo -o build/mojo_repos"
build-mojo-history = "mkdir -p build && mojo build -I src pipelines/mojo_history.mojo -o build/mojo_history"
build-pipelines = { depends-on = ["build-gharchive", "build-mojo-repos", "build-mojo-history"] }
build = { depends-on = ["build-orca", "build-pipelines", "build-console"] }
test = "mojo run -I src tests/test_versions.mojo && mojo run -I src tests/test_history.mojo && mojo run -I src tests/test_gzstream.mojo"

