name: CI

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:

jobs:
  # Build every program and run the tests, as on a laptop.
  test:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          # pixi.lock is written by this version.
          pixi-version: v0.78.0
      - run: pixi run build
      - run: pixi run test

  # Build the image `orca aws push` builds, then run one hour of GH Archive
  # through the gharchive pipeline inside it: the Linux-only failures (a
  # library that won't link, a CA bundle in the wrong place) show up here
  # rather than on AWS.
  image:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    env:
      GHCR_IMAGE: ghcr.io/magmalake/orca
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: |
          docker build -f Dockerfile.orca -t gharchive-image \
            --build-arg ORCA_SOURCE="https://github.com/${{ github.repository }}" \
            --build-arg ORCA_COMMIT="${{ github.sha }}" \
            --label org.opencontainers.image.source="https://github.com/${{ github.repository }}" \
            --label org.opencontainers.image.revision="${{ github.sha }}" .
      - name: Size
        run: docker image ls gharchive-image --format '{{.Size}}'
      - name: One hour of 2025-01-01 inside the image
        run: |
          docker run --rm --entrypoint sh \
            -e GHARCHIVE_HOURS=0 -e ORCA_WAREHOUSE=/tmp/w gharchive-image \
            -c 'gharchive run --partitions 2025-01-01'
      - name: The console starts and answers
        run: |
          docker run -d --name console -p 8080:8080 -e PORT=8080 \
            -e ORCA_WAREHOUSE=/tmp/w --entrypoint console gharchive-image
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://127.0.0.1:8080/ && exit 0
            sleep 1
          done
          docker logs console
          exit 1
      # What deploy/hetzner expects in orca.mojo: ghcr.io/magmalake/orca:<tag>.
      # Pushed from the image tested above (native arm64), on main and on tags
      # only; pull requests build and test but never push.
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push to GHCR
        if: github.event_name == 'push'
        run: |
          tags="${GITHUB_SHA::7}"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tags="$tags ${GITHUB_REF_NAME#v}"
          else
            tags="$tags latest"
          fi
          for t in $tags; do
            docker tag gharchive-image "$GHCR_IMAGE:$t"
            docker push "$GHCR_IMAGE:$t"
          done
